<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>DrawningHall - Desenhar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@2/lib/p5.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
    <h1>DrawningHall - Área de Desenho</h1>

    <div class="controles">
        <label for="escolher-cor">Selecione uma cor:</label>
        <input type="color" id="escolher-cor" value="#ff0000">

        <label for="escolher-espessura">Espessura da linha:</label>
        
        <input type="number" id="escolher-espessura" value="5" min="1" max="50">
        
        <small style="margin-left: 10px;">Aperte <b>Espaço</b> ou <b>C</b> para limpar</small>
    </div>


    <script>
        let corElemento;
        let espessuraElemento;

       
        let larguraCanvas = Number("{{ largura }}") || 800;
        let alturaCanvas = Number("{{ altura }}") || 600;

        function setup() {

            createCanvas(larguraCanvas, alturaCanvas);
            background(255); 
            corElemento = document.getElementById('escolher-cor');
            espessuraElemento = document.getElementById('escolher-espessura');
            
        }

        function draw() {
            if (mouseIsPressed) {
                stroke(corElemento.value);
                strokeWeight(Number(espessuraElemento.value));
                line(pmouseX, pmouseY, mouseX, mouseY);
            }
        }

        function keyPressed() {
        
            if (key === 'c' || key === 'C' || keyCode === 32) {
                background(255);
            }
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
</body>
</html>
