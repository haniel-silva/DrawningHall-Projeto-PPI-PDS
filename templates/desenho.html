<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DrawningHall - Desenhar</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@2/lib/p5.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #e0e0e0;
        font-family: sans-serif;
    }
        h1 {
        margin-top: 10px;
        margin-bottom: 10px;
    }
    
        .controles { 
        margin-bottom: 20px; 
        background: white; 
        padding: 15px; 
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        display: flex;
        gap: 15px;
        align-items: center;
    }
    
        canvas {
        border: 2px solid #b0b0b0;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    </style>
    
<body>
    <h1>DrawningHall - Área de Desenho</h1>

    <div class="controles">
        <label for="escolher-cor">Selecione uma cor:</label>
        <input type="color" id="escolher-cor" value="#ff0000">

        <label for="escolher-espessura">Espessura da linha:</label>
        <i class="fa-solid fa-pen"></i>
        
        <input type="number" id="escolher-espessura" value="5" min="1" max="50">
        
        <small style="margin-left: 10px;">Aperte <b>Espaço</b> ou <b>C</b> para limpar</small>
    </div>


    <script>
        let corElemento;
        let espessuraElemento;

       
        let larguraCanvas = Number("{{ largura }}") || 800;
        let alturaCanvas = Number("{{ altura }}") || 600;

        function setup() {

            createCanvas(larguraCanvas, alturaCanvas);
            background(255); 
            corElemento = document.getElementById('escolher-cor');
            espessuraElemento = document.getElementById('escolher-espessura');
            
        }

        function draw() {
            if (mouseIsPressed) {
                stroke(corElemento.value);
                strokeWeight(Number(espessuraElemento.value));
                line(pmouseX, pmouseY, mouseX, mouseY);
            }
        }

        function keyPressed() {
        
            if (key === 'c' || key === 'C' || keyCode === 32) {
                background(255);
            }
        }
    </script>

</body>
</html>
