<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DrawningHall - Entrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card-auth { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: none; max-width: 420px; width: 100%; }
        .btn-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; }
        .btn-custom:hover { opacity: 0.9; color: white; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <div class="card card-auth shadow-lg p-4 rounded-4 text-center">
        <div class="mb-3">
            <span class="bg-light p-3 rounded-circle d-inline-block text-primary shadow-sm">
                <i class="fa fa-paint-brush fa-2x"></i>
            </span>
        </div>
        <h2 class="fw-bold mb-1 text-dark">DrawningHall</h2>
        <p class="text-muted small mb-4">Entre ou crie sua conta para desenhar e postar no mural</p>

        {% if erro %}
        <div class="alert alert-danger py-2 small" role="alert">{{ erro }}</div>
        {% endif %}

        <ul class="nav nav-pills nav-fill mb-3" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-semibold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login" type="button" role="tab">Entrar</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-semibold" id="cadastro-tab" data-bs-toggle="pill" data-bs-target="#cadastro" type="button" role="tab">Criar Conta</button>
            </li>
        </ul>

        <div class="tab-content" id="pills-tabContent">
            <div class="tab-pane fade show active text-start" id="login" role="tabpanel">
                <form action="{{ url_for('login') }}" method="POST">
                    <input type="hidden" name="acao" value="entrar">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Usuário</label>
                        <input type="text" name="usuario" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Senha</label>
                        <input type="password" name="senha" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-custom w-100 fw-bold py-2 rounded-3">Acessar Plataforma</button>
                </form>
            </div>

            <div class="tab-pane fade text-start" id="cadastro" role="tabpanel">
                <form action="{{ url_for('login') }}" method="POST">
                    <input type="hidden" name="acao" value="cadastrar">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Escolha um Usuário</label>
                        <input type="text" name="usuario" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Escolha uma Senha</label>
                        <input type="password" name="senha" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-custom w-100 fw-bold py-2 rounded-3">Cadastrar e Entrar</button>
                </form>
            </div>
        </div>
        
        <div class="mt-4">
            <a href="{{ url_for('ver_mural') }}" class="text-decoration-none text-muted small">
                <i class="fa fa-picture-o me-1"></i> Ver o Mural de Desenhos Público
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
