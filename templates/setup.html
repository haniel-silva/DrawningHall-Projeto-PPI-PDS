<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DrawningHall - Configurar Tela</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        body {
            /* Degradê idêntico ao da página de desenho */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .card-setup {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            max-width: 440px;
            width: 100%;
        }

        .titulo-pagina {
            color: #2d3748;
            font-weight: 800;
        }

        .btn-criar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-criar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(118, 75, 162, 0.4);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <div class="card card-setup shadow-lg p-4 rounded-4 text-center">
        <!-- Ícone do cabeçalho -->
        <div class="mb-3">
            <span class="bg-light p-3 rounded-circle d-inline-block text-primary shadow-sm">
                <i class="fa fa-paint-brush fa-2x" aria-hidden="true"></i>
            </span>
        </div>

        <h2 class="titulo-pagina h3 mb-1">DrawningHall</h2>
        <p class="text-muted small mb-4">Defina as dimensões da sua tela de desenho</p>

        <!-- Formulário integrado ao Flask -->
        <form action="{{ url_for('desenhar') }}" method="POST" class="text-start">
            
            <!-- Campo de Altura -->
            <div class="mb-3">
                <label for="altura" class="form-label fw-semibold text-secondary">
                    <i class="fa fa-arrows-v me-1"></i> Altura (pixels):
                </label>
                <div class="input-group">
                    <input type="number" id="altura" name="altura-escolher" class="form-control form-control-lg" value="600" min="100" max="2000" required>
                    <span class="input-group-text bg-light text-muted">px</span>
                </div>
            </div>

            <!-- Campo de Largura -->
            <div class="mb-4">
                <label for="largura" class="form-label fw-semibold text-secondary">
                    <i class="fa fa-arrows-h me-1"></i> Largura (pixels):
                </label>
                <div class="input-group">
                    <input type="number" id="largura" name="largura-escolher" class="form-control form-control-lg" value="800" min="100" max="2000" required>
                    <span class="input-group-text bg-light text-muted">px</span>
                </div>
            </div>

            <!-- Botão de Ação -->
            <button type="submit" class="btn btn-primary btn-criar btn-lg w-100 fw-bold py-2 rounded-3 text-white">
                <i class="fa fa-magic me-2"></i> Criar tela de desenhos
            </button>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
