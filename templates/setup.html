<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>DrawningHall</title>
  <!-- Importando a biblioteca p5.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

  </style>
</head>
<body>
  <h1>DrawningHall - O seu site de desenhos!</h1>


  <form action="{{ url_for('desenhar') }}" method="POST">
    <label for="altura" id="tamanho">Selecione a altura:</label>
    <input type="number" id="altura" name="altura-escolher" value="0">

    <label for="largura" id="tamanho">Selecione a largura:</label>
    <input type="number" id="largura" name="largura-escolher" value="0">

    <button type="submit">Criar tela de desenhos</button>
  </form>
  
</body>
</html>
